<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather | Shamba AI</title><link rel="stylesheet" href="/css/styles.css"></head><body><header class="nav"><a class="brand" href="/">🌱 Shamba AI</a></header><main class="page narrow"><p class="eyebrow">WEATHER</p><h1>Check a real forecast.</h1><p class="lead">Search a town to request current conditions from the configured provider.</p><form id="weather-form" class="inline-form"><input name="location" placeholder="Town or city" required><button class="button">Check weather</button></form><div id="weather-result" class="result"></div></main><script>document.getElementById('weather-form').addEventListener('submit',async e=>{e.preventDefault();const d=await fetch('/api/weather?location='+encodeURIComponent(e.target.location.value),{credentials:'same-origin'}).then(r=>r.json());document.getElementById('weather-result').textContent=d.error||JSON.stringify(d.weather)})</script></body></html>
