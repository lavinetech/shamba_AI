<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Disease analysis | Shamba AI</title><link rel="stylesheet" href="/css/styles.css"></head><body><header class="nav"><a class="brand" href="/">🌱 Shamba AI</a></header><main class="page narrow"><p class="eyebrow">CROP PHOTO WORKFLOW</p><h1>Upload a photo for review.</h1><p class="lead">We validate and securely receive the image. No diagnosis is claimed unless a vision-capable model is configured.</p><form id="disease-form" class="auth-card"><label>Crop name<input name="cropName" required></label><label>Location<input name="location"></label><label>Visible symptoms<textarea name="symptoms"></textarea></label><label>Photo<input type="file" name="image" accept="image/jpeg,image/png,image/webp" required></label><button class="button">Submit photo</button><p id="form-message"></p></form><script>document.getElementById('disease-form').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/disease/analyze',{method:'POST',body:new FormData(e.target),credentials:'same-origin'});const data=await r.json();document.getElementById('form-message').textContent=data.message||data.error||'Upload failed.'})</script></main></body></html>
