<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guide | Shamba AI</title><link rel="stylesheet" href="/css/styles.css"></head><body><header class="nav"><a class="brand" href="/">🌱 Shamba AI</a><nav><a href="/guides.html">All guides</a><a href="/assistant.html">Assistant</a></nav></header><main class="page narrow" id="guide"><p class="eyebrow">FARMING GUIDE</p><h1>Loading guide…</h1></main><script>const id=new URLSearchParams(location.search).get('id');fetch('/api/guides/'+encodeURIComponent(id||'' )).then(r=>r.json()).then(d=>{const g=d.guide;if(!g)throw new Error(d.error);document.title=g.title+' | Shamba AI';document.getElementById('guide').innerHTML='<p class="eyebrow">'+g.category+'</p><h1>'+g.title+'</h1><p class="lead">'+g.overview+'</p><div class="result">'+Object.entries(g.content).map(([k,v])=>'<p><b>'+k+'</b><br>'+v+'</p>').join('')+'</div><p class="note">General guidance only. Confirm local recommendations before acting.</p>'}).catch(e=>{document.getElementById('guide').innerHTML='<h1>Guide unavailable</h1><p>'+e.message+'</p>'})</script></body></html>
